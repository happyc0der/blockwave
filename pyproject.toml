[project]
name = "tetris-rl"
version = "0.1.0"
description = "Miami Vice arcade Tetris simulator with a Gymnasium environment for vision-based RL"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pygame-ce>=2.5",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tetris = "tetris.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
